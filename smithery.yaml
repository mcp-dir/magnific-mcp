# Smithery configuration for Magnific
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_magnific

name: magnific-mcp
displayName: "Magnific"
description: >
  Magnific por linguagem natural: faça upscale de imagens, gere e liste suas criações. Conecte com sua conta Magnific e use os créditos do seu plano.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/magnific-mcp
repository: https://github.com/mcp-dir/magnific-mcp

tags:
  - magnific
  - brazil
  - horizontal
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_magnific

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_magnific/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
